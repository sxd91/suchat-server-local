<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suchat Local Admin</title><style>body{margin:0;background:#0b1020;color:#e8efff;font:15px system-ui,sans-serif}main{max-width:1080px;margin:48px auto;padding:0 24px}.card{background:#161e35;border:1px solid #2a375a;border-radius:16px;padding:20px;margin:16px 0}input,button{border-radius:10px;padding:10px 12px;border:1px solid #3a4d79;background:#0e1730;color:#fff}button{background:#5b9cff;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{font-size:28px;font-weight:700}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #2a375a;text-align:left}</style></head><body><main><h1>Suchat Local Admin</h1><p id="hint">请使用本地管理员账号登录。</p><section id="login" class="card"><h2>管理员登录</h2><input id="handle" value="admin" placeholder="账号"><input id="password" value="change-me" type="password" placeholder="密码"><button onclick="login()">登录</button></section><section id="dashboard" hidden><div class="grid" id="metrics"></div><div class="card"><h2>用户</h2><table><thead><tr><th>账号</th><th>昵称</th><th>状态</th><th>注册时间</th></tr></thead><tbody id="users"></tbody></table></div><div class="card"><h2>系统状态</h2><pre id="system"></pre></div></section></main><script>async function login(){const r=await fetch('/api/admin/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({handle:handle.value,password:password.value})});if(!r.ok){hint.textContent='登录失败，请检查账号或密码。';return}login.hidden=true;dashboard.hidden=false;hint.textContent='已登录本地管理后台。';load()}async function load(){const [d,u,s]=await Promise.all(['/api/admin/v1/dashboard','/api/admin/v1/users','/api/admin/v1/system/status'].map(x=>fetch(x).then(r=>r.json())));metrics.innerHTML=[['注册用户',d.users.total],['在线连接',d.realtime.connections],['今日消息',d.content.messagesToday],['数据库字节',d.storage.databaseBytes]].map(x=>'<div class="card"><div>'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>').join('');users.innerHTML=u.items.map(x=>'<tr><td>'+x.handle+'</td><td>'+x.displayName+'</td><td>'+x.status+'</td><td>'+x.createdAt+'</td></tr>').join('');system.textContent=JSON.stringify(s,null,2)}</script></body></html>
